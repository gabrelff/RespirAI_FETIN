<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RespirAR - Painel Clínico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BARRA SUPERIOR FIXA -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="logo-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-scan-heart">
                    <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                    <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                    <path d="M7.828 13.07A3 3 0 0 1 12 8.764a3 3 0 0 1 4.172 4.306l-3.447 3.62a1 1 0 0 1-1.449 0z" />
                </svg>
                <span class="logo-text">RespirAR</span>
            </a>
        </div>

        <div class="topbar-right">
            <div class="mcu-status-wrapper">
                <div class="mcu-badge mcu-online" id="mcu-badge"
                    title="Status da conexão do ESP32 (clique para testar alternância)">
                    <span class="mcu-pulse-dot" id="mcu-dot"></span>
                    <svg class="mcu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect width="16" height="16" x="4" y="4" rx="2" />
                        <path d="M9 9h6v6H9z" />
                        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" />
                    </svg>
                    <div class="mcu-info">
                        <span class="mcu-tag">ESP32</span>
                        <span class="mcu-status-text" id="mcu-status-text">Online</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (DASHBOARD) -->
    <main class="main-content">
        <div class="header">
            <h1>Qualidade Respiratória</h1>
            <p>Monitoramento em tempo real dos gases expelidos pelo pulmão</p>
        </div>

        <!-- GRADE DE GASES (6 CARDS) -->
        <div class="cards-grid">
            <!-- 1. CO -->
            <div class="card gas-card">
                <div class="card-header">
                    <div class="gas-title-group">
                        <div class="gas-formula">CO</div>
                        <span class="card-title">Monóxido de Carbono</span>
                    </div>
                </div>
                <div class="card-value">
                    <span id="val-CO">--</span>
                    <span class="gas-unit">PPM</span>
                </div>
            </div>

            <!-- 2. CH4 -->
            <div class="card gas-card">
                <div class="card-header">
                    <div class="gas-title-group">
                        <div class="gas-formula">CH<sub>4</sub></div>
                        <span class="card-title">Metano</span>
                    </div>
                </div>
                <div class="card-value">
                    <span id="val-CH4">--</span>
                    <span class="gas-unit">PPM</span>
                </div>
            </div>

            <!-- 3. C2H5OH -->
            <div class="card gas-card">
                <div class="card-header">
                    <div class="gas-title-group">
                        <div class="gas-formula">C<sub>2</sub>H<sub>5</sub>OH</div>
                        <span class="card-title">Etanol / Álcool</span>
                    </div>
                </div>
                <div class="card-value">
                    <span id="val-C2H5OH">--</span>
                    <span class="gas-unit">PPM</span>
                </div>
            </div>

            <!-- 4. H2 -->
            <div class="card gas-card">
                <div class="card-header">
                    <div class="gas-title-group">
                        <div class="gas-formula">H<sub>2</sub></div>
                        <span class="card-title">Hidrogênio</span>
                    </div>
                </div>
                <div class="card-value">
                    <span id="val-H2">--</span>
                    <span class="gas-unit">PPM</span>
                </div>
            </div>

            <!-- 5. NH3 -->
            <div class="card gas-card">
                <div class="card-header">
                    <div class="gas-title-group">
                        <div class="gas-formula">NH<sub>3</sub></div>
                        <span class="card-title">Amônia</span>
                    </div>
                </div>
                <div class="card-value">
                    <span id="val-NH3">--</span>
                    <span class="gas-unit">PPM</span>
                </div>
            </div>

            <!-- 6. NO2 -->
            <div class="card gas-card">
                <div class="card-header">
                    <div class="gas-title-group">
                        <div class="gas-formula">NO<sub>2</sub></div>
                        <span class="card-title">Dióxido de Nitrogênio</span>
                    </div>
                </div>
                <div class="card-value">
                    <span id="val-NO2">--</span>
                    <span class="gas-unit">PPM</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

</body>

</html>
