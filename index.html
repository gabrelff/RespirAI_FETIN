<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RespirAI - Painel Clínico</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- BARRA SUPERIOR FIXA -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="logo-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-scan-heart">
                    <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                    <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                    <path d="M7.828 13.07A3 3 0 0 1 12 8.764a3 3 0 0 1 4.172 4.306l-3.447 3.62a1 1 0 0 1-1.449 0z" />
                </svg>
                <span class="logo-text">RespirAI</span>
            </a>
        </div>

        <div class="topbar-right">
            <div class="mcu-status-wrapper">
                <div class="mcu-badge mcu-online" id="mcu-badge"
                    title="Status da conexão do microcontrolador (clique para testar alternância)">
                    <span class="mcu-pulse-dot" id="mcu-dot"></span>
                    <svg class="mcu-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect width="16" height="16" x="4" y="4" rx="2" />
                        <path d="M9 9h6v6H9z" />
                        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" />
                    </svg>
                    <div class="mcu-info">
                        <span class="mcu-tag">ESP32</span>
                        <span class="mcu-status-text" id="mcu-status-text">Online</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (DASHBOARD) -->
    <main class="main-content">
        <div class="header">
            <h1>Painel Clínico</h1>
            <p>Painel de monitoramento dos registros e análise de risco</p>
        </div>

        <div class="cards-grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Total de Pacientes</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 21a8 8 0 0 0-16 0" />
                        <circle cx="10" cy="8" r="5" />
                        <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" />
                    </svg>
                </div>
                <div class="card-value">8</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Risco Crítico</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
                        <path d="M12 9v4" />
                        <path d="M12 17h.01" />
                    </svg>
                </div>
                <div class="card-value" style="color: #ef4444;">2</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Risco Alto</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
                        <path d="M12 9v4" />
                        <path d="M12 17h.01" />
                    </svg>
                </div>
                <div class="card-value" style="color: #f59e0b;">7</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Frequência Respiratória</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                </div>
                <div class="card-value"><span id="displayRpm">16</span> <span
                        style="font-size: 16px; color: var(--text-muted); font-weight: 500;">RPM</span></div>
            </div>
        </div>

        <!-- PARTE DO GRÁFICO -->
        <div class="chart-container">
            <div class="chart-header">
                <div class="chart-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                    Sinal Respiratório em Tempo Real
                </div>
            </div>
            <div class="chart-canvas-wrapper">
                <canvas id="graficoSinal"></canvas>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

</body>

</html>
